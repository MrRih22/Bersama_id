<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Klien | Bersama.id</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Lato', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: {
                        sage: { 50: '#f4f6f4', 100: '#e4e9e5', 200: '#cbd4cc', 300: '#a6b5a8', 500: '#697e6d', 600: '#526456', 800: '#334036', 900: '#232c25' },
                        earth: { 100: '#f9f3ee', 200: '#f0dfd1', 500: '#d4a373', 600: '#b58255', 700: '#8c613c' },
                        cream: '#fdfdfc'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sage-50 text-slate-700 font-sans selection:bg-sage-200 overflow-hidden">

    <div class="flex h-screen w-full">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-sage-200 transform -translate-x-full lg:translate-x-0 lg:relative transition-transform duration-300 ease-in-out flex flex-col shadow-lg lg:shadow-none">
            <div class="h-20 flex items-center px-6 border-b border-sage-100">
                <a href="index.html" class="text-2xl font-bold font-serif text-sage-900 flex items-center gap-3">
                    <i class="fa-solid fa-leaf text-earth-500 text-lg"></i> Bersama.id
                </a>
            </div>

            <div class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
                <p class="px-3 text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Menu Utama</p>
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-3 rounded-lg bg-earth-50 text-earth-600 font-bold transition">
                    <i class="fa-solid fa-house w-5 text-center"></i> Dashboard
                </a>
            </div>

            <div class="p-4 border-t border-sage-100">
                <!-- Tombol Logout -->
                <button onclick="logoutUser()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 hover:bg-red-50 hover:text-red-600 font-semibold transition">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Overlay Mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-sage-900/50 z-40 hidden lg:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

        <!-- MAIN AREA -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            
            <!-- Topbar -->
            <header class="h-20 bg-white border-b border-sage-200 flex items-center justify-between px-6 lg:px-10 shrink-0 shadow-sm z-30">
                <div class="flex items-center gap-4">
                    <button id="btn-sidebar" class="lg:hidden text-sage-600 hover:text-sage-900 focus:outline-none text-xl">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="text-xl font-bold font-serif text-sage-900 hidden sm:block">Panel Klien</h2>
                </div>
                
                <div class="flex items-center gap-5">
                    <div class="flex items-center gap-3 cursor-pointer">
                        <div class="text-right hidden md:block">
                            <!-- Nama Pengguna yang sedang login otomatis tampil di sini -->
                            <p id="user-name-display" class="text-sm font-bold text-sage-900">Memuat nama...</p>
                            <p class="text-xs text-slate-400">Paket Premium</p>
                        </div>
                        <img src="https://ui-avatars.com/api/?name=User&background=d4a373&color=fff" alt="Profile" class="w-10 h-10 rounded-full border-2 border-earth-200">
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-sage-50/50 p-6 lg:p-10">
                
                <div class="bg-gradient-to-r from-sage-800 to-sage-600 rounded-2xl p-8 text-white shadow-lg mb-8 relative overflow-hidden">
                    <i class="fa-solid fa-rings-wedding absolute -right-6 -bottom-6 text-[10rem] text-white opacity-10 transform -rotate-12 pointer-events-none"></i>
                    <div class="relative z-10">
                        <h2 class="text-2xl sm:text-3xl font-serif font-bold mb-2">Selamat Datang di Dashboard!</h2>
                        <p class="text-sage-100 mb-6 max-w-2xl text-sm sm:text-base leading-relaxed">Kelola data acara, atur tema, dan pantau daftar tamu yang hadir melalui panel ini.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl border border-sage-200 shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-paper-plane"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Tamu Diundang</p><h3 class="text-2xl font-bold text-sage-900 mt-1">128</h3></div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-sage-200 shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-green-50 text-green-500 flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-calendar-check"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Konfirmasi Hadir</p><h3 class="text-2xl font-bold text-sage-900 mt-1">85</h3></div>
                    </div>
                </div>

                <p class="text-center text-xs text-slate-400 mt-10">Copyright © 2026 Bersama.id Dashboard. Dilindungi Undang-Undang.</p>
            </main>
        </div>
    </div>

    <!-- 1. Panggil Supabase DI SINI (Sebelum auth.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Panggil auth.js milik kita -->
    <script src="auth.js"></script>

    <script>
        const btnSidebar = document.getElementById('btn-sidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            if(overlay.classList.contains('hidden')) {
                overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0');
            } else {
                setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);
            }
        }
        btnSidebar.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
