<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lupa Kata Sandi | Bersama.id</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahkan ini di semua file HTML kamu -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Lato', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: {
                        sage: { 50: '#f4f6f4', 100: '#e4e9e5', 200: '#cbd4cc', 300: '#a6b5a8', 500: '#697e6d', 600: '#526456', 800: '#334036', 900: '#232c25' },
                        earth: { 100: '#f9f3ee', 200: '#f0dfd1', 500: '#d4a373', 600: '#b58255', 700: '#8c613c' },
                        cream: '#fdfdfc'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sage-50 text-slate-700 font-sans selection:bg-sage-200 min-h-screen flex flex-col justify-center py-10 sm:py-12 px-6 lg:px-8">

    <div id="alert-box" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg text-sm font-bold text-white transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <span id="alert-message">Notifikasi</span>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-[500px] relative z-10">
        <div class="bg-white rounded-3xl shadow-2xl shadow-sage-900/10 p-8 sm:p-12">
            
            <div class="text-center mb-8">
                <i class="fa-solid fa-unlock-keyhole text-4xl text-earth-500 mb-4"></i>
                <h2 class="text-3xl font-serif font-bold text-sage-900">Lupa Kata Sandi?</h2>
                <p class="mt-2 text-sm text-slate-500">Masukkan email yang terdaftar, kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.</p>
            </div>
            
            <form id="form-forgot" class="space-y-5" autocomplete="on">
                <div>
                    <label class="block text-sm font-bold text-sage-900 mb-1.5">Alamat Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="forgot-email" required class="w-full pl-11 pr-4 py-3 rounded-xl border border-sage-200 focus:outline-none focus:border-earth-500 bg-slate-50 focus:bg-white text-sm transition" placeholder="email@anda.com">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-sage-900 text-white font-bold text-sm py-3.5 rounded-xl hover:bg-sage-800 transition shadow-lg mt-4">
                    Kirim Tautan Pemulihan
                </button>
            </form>
            
            <p class="mt-8 text-center text-sm text-slate-500">
                Ingat kata sandi Anda? <a href="login.html" class="font-bold text-earth-500 hover:underline">Kembali masuk</a>
            </p>
        </div>
    </div>

      <!-- 1. Panggil Supabase DI SINI (Sebelum auth.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Panggil auth.js milik kita -->
    <script src="auth.js"></script>
</body>
</html>
